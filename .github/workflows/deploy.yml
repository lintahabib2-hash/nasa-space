# Deploy production frontend build to the public static host (GitHub Pages)
# Owner: Member 6 (Backend, Integration, QA & Deployment)
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Live URL: https://<owner>.github.io/<repo>/  (see docs/deployment.md)
#
# Order: test -> build -> deploy -> run the browser tests against the LIVE URL.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests
        run: python -m pytest -q
      - name: Offline snapshot is up to date
        run: python backend/scripts/export_static_snapshot.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Type check and unit tests
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Browser tests against the build
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      # Pages must be switched on once by a repo admin. Until then, finish green with a clear
      # warning instead of failing every push to main.
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Tests and build passed, but nothing was deployed. A repo admin must set Settings -> Pages -> Build and deployment -> Source: GitHub Actions, then re-run this workflow."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Offline + scenario tests against the live URL
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:e2e
