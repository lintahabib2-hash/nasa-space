# CI: lint + backend pytest + frontend vitest on every PR
# Owner: Member 6 (Backend, Integration, QA & Deployment)
#
# Mark both jobs ("backend" and "frontend") as required status checks on `main`
# (Settings -> Branches -> branch protection) so nothing merges red.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Backend tests (unit + integration)
        run: python -m pytest -q
      - name: Offline snapshot is up to date
        run: python backend/scripts/export_static_snapshot.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build (also generates sw.js)
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (offline mode, scenarios)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
