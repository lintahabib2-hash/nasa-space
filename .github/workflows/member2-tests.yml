name: Member 2 Analytics Tests

on:
  push:
  pull_request:

jobs:
  analytics-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run Member 2 legacy tests
        run: python -m unittest discover -s prototypes/offline_research/tests -v

      - name: Run Member 2 production tests
        run: |
          python -m unittest discover -s backend/tests/unit -p 'test_baseline.py' -v
          python -m unittest discover -s backend/tests/unit -p 'test_member2_adapter_paths.py' -v
          python -m unittest discover -s backend/tests/unit -p 'test_simulated_crew.py' -v
          python -m unittest discover -s backend/tests/unit -p 'test_review_fixes.py' -v
          python -m unittest discover -s backend/tests/unit -p 'test_persistence.py' -v
          python -m unittest discover -s backend/tests/unit -p 'test_validation.py' -v
